<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#fbfaf6" />
  <title>Cocina ETC 89 V2· Lyrics</title>
  <style>
    :root{
      --bg:#fbfaf6;
      --bg-2:#ffffff;
      --text:#171717;
      --muted:rgba(23,23,23,.27);
      --hover:rgba(23,23,23,.55);
      --gold:#b58a2d;
      --gold-2:#d6b65e;
      --glass:rgba(255,255,255,.68);
      --line:rgba(181,138,45,.20);
      --shadow:0 18px 60px rgba(73,52,12,.08);
    }
    html[data-theme="dark"]{
      --bg:#0d0d0c;
      --bg-2:#151410;
      --text:#f8f4e9;
      --muted:rgba(248,244,233,.27);
      --hover:rgba(248,244,233,.58);
      --gold:#d6ad4e;
      --gold-2:#f0cf76;
      --glass:rgba(18,17,14,.72);
      --line:rgba(214,173,78,.18);
      --shadow:0 18px 70px rgba(0,0,0,.26);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100dvh;
      overflow:hidden;
      color:var(--text);
      background:
        radial-gradient(circle at 78% 16%, color-mix(in srgb,var(--gold) 11%,transparent), transparent 30%),
        radial-gradient(circle at 15% 78%, color-mix(in srgb,var(--gold-2) 8%,transparent), transparent 34%),
        linear-gradient(145deg,var(--bg-2),var(--bg));
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      transition:background .35s ease,color .35s ease;
    }
    body::after{
      content:"";
      position:fixed; inset:0; pointer-events:none;
      background:linear-gradient(to bottom,var(--bg) 0%,transparent 16%,transparent 78%,var(--bg) 100%);
      opacity:.62;
    }
    button{font:inherit}
    .topbar{
      position:fixed; z-index:20; top:0; left:0; right:0;
      display:flex; align-items:center; justify-content:space-between;
      padding:calc(18px + env(safe-area-inset-top)) clamp(18px,4vw,54px) 14px;
      background:linear-gradient(to bottom,var(--bg) 10%,transparent);
    }
    .brand{display:flex;flex-direction:column;gap:2px;letter-spacing:.08em}
    .brand strong{font-size:.83rem;letter-spacing:.18em}
    .brand span{font-size:.66rem;color:var(--gold);font-weight:750;letter-spacing:.22em}
    .actions{display:flex;align-items:center;gap:8px}
    .icon-btn{
      width:42px;height:42px;border:1px solid var(--line);border-radius:50%;
      display:grid;place-items:center;background:var(--glass);color:var(--text);
      box-shadow:var(--shadow);backdrop-filter:blur(14px);
      cursor:pointer;transition:transform .18s ease,border-color .25s ease,background .35s ease;
    }
    .icon-btn:hover{transform:translateY(-1px);border-color:var(--gold)}
    .icon-btn:active{transform:scale(.95)}
    .icon{width:18px;height:18px;display:block}
    .lyrics-shell{
      height:100dvh;
      max-width:1100px;
      margin:0 auto;
      padding:clamp(100px,13vh,145px) clamp(22px,7vw,84px) clamp(100px,14vh,150px);
      position:relative; z-index:2;
    }
    .lyrics{
      height:100%;
      overflow-y:auto;
      scrollbar-width:none;
      overscroll-behavior:contain;
      scroll-padding-block:42%;
      mask-image:linear-gradient(to bottom,transparent 0%,#000 12%,#000 82%,transparent 100%);
      -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 12%,#000 82%,transparent 100%);
    }
    .lyrics::-webkit-scrollbar{display:none}
    .spacer{height:38vh}
    .lyric{
      width:fit-content; max-width:930px;
      margin:0 0 clamp(22px,4vh,44px);
      color:var(--muted);
      font-size:clamp(1.75rem,4.4vw,4.45rem);
      line-height:1.04;
      letter-spacing:-.035em;
      font-weight:760;
      cursor:pointer;
      transform-origin:left center;
      transition:color .34s ease,opacity .34s ease,transform .34s cubic-bezier(.2,.8,.2,1);
      text-wrap:balance;
    }
    .lyric:hover{color:var(--hover)}
    .lyric.active{
      color:var(--text);
      transform:scale(1.018);
    }
    .lyric.active::after{
      content:"";
      display:block;
      width:clamp(34px,6vw,72px);height:3px;border-radius:99px;
      margin-top:13px;background:linear-gradient(90deg,var(--gold),var(--gold-2));
    }
    .lyric.music{color:var(--gold);font-size:2rem}
    .status{
      position:fixed; z-index:12; left:clamp(18px,4vw,54px); bottom:calc(20px + env(safe-area-inset-bottom));
      font-size:.72rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);
      opacity:.8;
    }
    .start{
      position:fixed; z-index:50; inset:0;
      display:grid; place-items:center; text-align:center;
      padding:30px;
      background:
        radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--gold) 13%,transparent),transparent 35%),
        var(--bg);
      transition:opacity .55s ease,visibility .55s ease;
    }
    .start.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .start-card{max-width:680px}
    .monogram{
      width:78px;height:78px;margin:0 auto 28px;border:1px solid var(--gold);
      border-radius:50%;display:grid;place-items:center;color:var(--gold);
      font-family:Georgia,serif;font-size:1.25rem;letter-spacing:.08em;
    }
    .start h1{
      margin:0;font-size:clamp(2.6rem,8vw,6.7rem);line-height:.9;letter-spacing:-.055em;
      text-wrap:balance;
    }
    .start p{
      margin:20px 0 30px;color:var(--gold);font-weight:750;letter-spacing:.18em;
      text-transform:uppercase;font-size:.76rem;
    }
    .start-btn{
      border:0;border-radius:999px;padding:14px 23px;
      background:var(--text);color:var(--bg);
      font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
      transition:transform .2s ease,box-shadow .2s ease;
    }
    .start-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
    .start-btn:active{transform:scale(.98)}
    .hint{
      position:fixed;z-index:11;right:clamp(18px,4vw,54px);bottom:calc(20px + env(safe-area-inset-bottom));
      font-size:.68rem;color:var(--muted);letter-spacing:.04em;
    }
    @media (max-width:640px){
      .brand span{display:none}
      .lyrics-shell{padding-left:22px;padding-right:22px}
      .lyric{font-size:clamp(1.85rem,9.5vw,3.35rem);margin-bottom:28px}
      .hint{display:none}
      .status{font-size:.64rem}
    }
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}
    }
  </style>
</head>
<body>
  <audio id="audio" preload="metadata" src="INTRO COCINA ETC LXXXIX.mp3"></audio>

  <header class="topbar">
    <div class="brand">
      <strong>COCINA ETC 89</strong>
      <span>EL SAZÓN QUE TE MUEVE</span>
    </div>
    <div class="actions">
      <button class="icon-btn" id="pauseBtn" aria-label="Pausar o continuar" title="Pausar / continuar">
        <svg class="icon" id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M7 5h3v14H7zm7 0h3v14h-3z"/>
        </svg>
      </button>
      <button class="icon-btn" id="restartBtn" aria-label="Reiniciar" title="Reiniciar">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6"/>
        </svg>
      </button>
      <button class="icon-btn" id="themeBtn" aria-label="Cambiar tema" title="Modo claro / oscuro">
        <svg class="icon" id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="lyrics-shell">
    <div class="lyrics" id="lyrics" aria-live="off"></div>
  </main>

  <div class="status" id="status">Preparado</div>
  <div class="hint">Toca una línea para ir a ese momento</div>

  <section class="start" id="start">
    <div class="start-card">
      <div class="monogram">89</div>
      <h1>Cocina<br>ETC 89</h1>
      <p>El sazón que te mueve</p>
      <button class="start-btn" id="startBtn">Comenzar</button>
    </div>
  </section>

  <script>
    const audio = document.getElementById('audio');
    const lyricsEl = document.getElementById('lyrics');
    const start = document.getElementById('start');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const restartBtn = document.getElementById('restartBtn');
    const themeBtn = document.getElementById('themeBtn');
    const statusEl = document.getElementById('status');

    let lyrics = [];
    let activeIndex = -1;
    let autoScroll = true;
    let resumeTimer = null;

    const playSVG = '<path d="M8 5v14l11-7z"/>';
    const pauseSVG = '<path d="M7 5h3v14H7zm7 0h3v14h-3z"/>';

    function parseLRC(text){
      const rows = [];
      const re = /^\[(\d{2}):(\d{2}(?:\.\d+)?)\](.*)$/;
      text.split(/\r?\n/).forEach(line => {
        const m = line.match(re);
        if(!m) return;
        const time = Number(m[1]) * 60 + Number(m[2]);
        const text = m[3].trim();
        if(!text) return;
        rows.push({time, text});
      });
      return rows.sort((a,b) => a.time - b.time);
    }

    async function loadLyrics(){
      const res = await fetch('lyrics.lrc');
      if(!res.ok) throw new Error('No se pudo cargar lyrics.lrc');
      lyrics = parseLRC(await res.text());
      renderLyrics();
    }

    function renderLyrics(){
      lyricsEl.innerHTML = '<div class="spacer"></div>';
      lyrics.forEach((item,i) => {
        const line = document.createElement('div');
        line.className = 'lyric' + (item.text === '♪' ? ' music' : '');
        line.textContent = item.text;
        line.dataset.index = i;
        line.tabIndex = 0;
        line.setAttribute('role','button');
        line.setAttribute('aria-label', `Ir a ${formatTime(item.time)}: ${item.text}`);
        const seek = () => {
          audio.currentTime = item.time;
          if(audio.paused) audio.play();
          autoScroll = true;
          sync(true);
        };
        line.addEventListener('click', seek);
        line.addEventListener('keydown', e => {
          if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); seek(); }
        });
        lyricsEl.appendChild(line);
      });
      lyricsEl.insertAdjacentHTML('beforeend','<div class="spacer"></div>');
    }

    function currentLyricIndex(t){
      let lo = 0, hi = lyrics.length - 1, ans = -1;
      while(lo <= hi){
        const mid = (lo + hi) >> 1;
        if(lyrics[mid].time <= t){ ans = mid; lo = mid + 1; }
        else hi = mid - 1;
      }
      return ans;
    }

    function sync(force=false){
      const i = currentLyricIndex(audio.currentTime);
      if(i === activeIndex && !force) return;
      const old = lyricsEl.querySelector('.lyric.active');
      if(old) old.classList.remove('active');
      activeIndex = i;
      if(i >= 0){
        const el = lyricsEl.querySelector(`.lyric[data-index="${i}"]`);
        if(el){
          el.classList.add('active');
          if(autoScroll){
            el.scrollIntoView({behavior:'smooth', block:'center'});
          }
        }
      }
    }

    function formatTime(sec){
      const m = Math.floor(sec/60);
      const s = Math.floor(sec%60).toString().padStart(2,'0');
      return `${m}:${s}`;
    }

    function setPlayState(){
      const icon = document.getElementById('pauseIcon');
      icon.innerHTML = audio.paused ? playSVG : pauseSVG;
      pauseBtn.setAttribute('aria-label', audio.paused ? 'Continuar' : 'Pausar');
      statusEl.textContent = audio.paused ? 'Pausado' : 'Reproduciendo';
    }

    startBtn.addEventListener('click', async () => {
      start.classList.add('hidden');
      try{ await audio.play(); }catch(e){}
      setPlayState();
    });

    pauseBtn.addEventListener('click', async () => {
      if(audio.paused) await audio.play();
      else audio.pause();
      setPlayState();
    });

    restartBtn.addEventListener('click', async () => {
      audio.currentTime = 0;
      autoScroll = true;
      sync(true);
      if(audio.paused) await audio.play();
      setPlayState();
    });

    lyricsEl.addEventListener('wheel', () => userScrolled(), {passive:true});
    lyricsEl.addEventListener('touchmove', () => userScrolled(), {passive:true});
    function userScrolled(){
      autoScroll = false;
      clearTimeout(resumeTimer);
      resumeTimer = setTimeout(() => {
        autoScroll = true;
        sync(true);
      }, 3500);
    }

    function applyTheme(theme){
      document.documentElement.dataset.theme = theme;
      localStorage.setItem('etc89-theme', theme);
      document.querySelector('meta[name="theme-color"]').content =
        theme === 'dark' ? '#0d0d0c' : '#fbfaf6';
    }
    applyTheme(localStorage.getItem('etc89-theme') || 'light');

    themeBtn.addEventListener('click', () => {
      applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });

    audio.addEventListener('play', setPlayState);
    audio.addEventListener('pause', setPlayState);
    audio.addEventListener('ended', () => {
      setPlayState();
      statusEl.textContent = 'Finalizado';
    });
    audio.addEventListener('timeupdate', sync);
    audio.addEventListener('seeking', () => sync(true));

    loadLyrics().catch(err => {
      statusEl.textContent = 'Error al cargar letras';
      console.error(err);
    });
    setPlayState();
  </script>
</body>
</html>
