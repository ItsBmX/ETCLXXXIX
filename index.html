<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfaf6">
<title>Cocina ETC LXXXIX</title>
<style>
:root{--bg:#fbfaf6;--bg2:#fff;--text:#171717;--muted:rgba(23,23,23,.34);--gold:#b58a2d;--gold2:#d6b65e;--glass:rgba(255,255,255,.72);--line:rgba(181,138,45,.2);--shadow:0 18px 60px rgba(73,52,12,.09)}
html[data-theme=dark]{--bg:#0d0d0c;--bg2:#151410;--text:#f8f4e9;--muted:rgba(248,244,233,.32);--gold:#d6ad4e;--gold2:#f0cf76;--glass:rgba(18,17,14,.78);--line:rgba(214,173,78,.2);--shadow:0 18px 70px rgba(0,0,0,.3)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100dvh;color:var(--text);background:radial-gradient(circle at 78% 16%,color-mix(in srgb,var(--gold) 11%,transparent),transparent 30%),linear-gradient(145deg,var(--bg2),var(--bg));font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;transition:.3s}
button,input{font:inherit}.hidden{display:none!important}
.topbar{position:fixed;z-index:30;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) clamp(16px,4vw,48px) 12px;background:linear-gradient(to bottom,var(--bg) 25%,transparent)}
.brand{display:flex;flex-direction:column;gap:2px;letter-spacing:.08em}.brand strong{font-size:.8rem;letter-spacing:.16em}.brand span{font-size:.62rem;color:var(--gold);font-weight:800;letter-spacing:.18em}
.actions{display:flex;gap:8px}.icon-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--glass);color:var(--text);box-shadow:var(--shadow);backdrop-filter:blur(14px);cursor:pointer}.icon-btn svg{width:18px;height:18px}
.page{min-height:100dvh;padding:100px clamp(18px,5vw,60px) 70px}.page-inner{max-width:1050px;margin:auto}
.home{position:fixed;z-index:60;inset:0;overflow:auto;background:#fff;color:#171717;padding:calc(28px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom));display:grid;place-items:center}
.home-card{width:min(960px,100%);text-align:center}.home-logo{width:clamp(135px,21vw,210px);max-height:190px;object-fit:contain;margin:0 auto 18px;display:block}.home h1{margin:0;font-size:clamp(2.3rem,7vw,5.6rem);line-height:.92;letter-spacing:-.055em}.home-sub{margin:15px 0 32px;color:#b58a2d;font-size:.72rem;font-weight:850;letter-spacing:.2em}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:left}.choice{border:1px solid rgba(181,138,45,.2);background:#fbfaf6;border-radius:24px;padding:22px;cursor:pointer;min-height:150px;transition:.2s;box-shadow:0 12px 35px rgba(73,52,12,.06)}.choice:hover{transform:translateY(-3px);border-color:#b58a2d}.choice-icon{font-size:1.7rem;color:#b58a2d;margin-bottom:22px}.choice strong{display:block;font-size:.95rem;letter-spacing:.08em}.choice small{display:block;color:rgba(23,23,23,.52);margin-top:7px;line-height:1.35}
.section-title{text-align:center;margin:5vh 0 28px}.section-title h2{font-size:clamp(2rem,5vw,4rem);margin:0;letter-spacing:-.04em}.section-title p{color:var(--gold);font-weight:800;letter-spacing:.14em;font-size:.7rem}
.player-card{max-width:580px;margin:5vh auto 0;padding:clamp(24px,5vw,46px);border:1px solid var(--line);border-radius:34px;background:var(--glass);box-shadow:var(--shadow);backdrop-filter:blur(18px);text-align:center}.player-logo{width:clamp(130px,28vw,210px);max-height:200px;object-fit:contain}.track-title{font-size:clamp(1.5rem,4vw,2.3rem);font-weight:850;margin-top:16px}.track-sub{color:var(--gold);font-size:.72rem;font-weight:800;letter-spacing:.15em;margin-top:5px}.time-row{display:flex;justify-content:space-between;color:var(--muted);font-size:.72rem;margin-top:26px}.range{width:100%;accent-color:var(--gold);cursor:pointer}.transport{display:flex;align-items:center;justify-content:center;gap:24px;margin:24px 0}.transport button{border:0;background:transparent;color:var(--text);cursor:pointer;font-weight:800}.main-play{width:68px;height:68px!important;border-radius:50%!important;background:var(--text)!important;color:var(--bg)!important;font-size:1.3rem!important}
.video-card{max-width:760px;margin:auto}.video-wrap{position:relative;width:min(100%,480px);margin:auto;border-radius:28px;overflow:hidden;background:#080808;box-shadow:var(--shadow);aspect-ratio:478/850}.video-wrap video{width:100%;height:100%;display:block;object-fit:contain}.video-state{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.28);pointer-events:none;font-weight:800;letter-spacing:.06em}.buffer-box{width:min(100%,480px);margin:14px auto}.buffer-label{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-bottom:7px}.buffer-track{height:7px;border-radius:99px;background:color-mix(in srgb,var(--text) 10%,transparent);overflow:hidden}.buffer-fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .25s}.chapters{width:min(100%,600px);margin:22px auto;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.chapters button{border:1px solid var(--line);background:var(--glass);color:var(--text);border-radius:999px;padding:9px 13px;cursor:pointer}
.lyrics-shell{height:100dvh;max-width:1100px;margin:auto;padding:clamp(100px,13vh,145px) clamp(22px,7vw,84px) clamp(100px,14vh,150px)}.lyrics{height:100%;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;scroll-padding-block:42%;mask-image:linear-gradient(to bottom,transparent,#000 12%,#000 82%,transparent);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 12%,#000 82%,transparent)}.lyrics::-webkit-scrollbar{display:none}.spacer{height:38vh}.lyric{width:fit-content;max-width:930px;margin:0 0 clamp(22px,4vh,44px);color:var(--muted);font-size:clamp(1.75rem,4.4vw,4.45rem);line-height:1.04;letter-spacing:-.035em;font-weight:760;cursor:pointer;transition:.3s}.lyric.active{color:var(--text);transform:scale(1.018)}.lyric.active:after{content:"";display:block;width:clamp(34px,6vw,72px);height:3px;border-radius:99px;margin-top:13px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.status{position:fixed;z-index:12;left:clamp(18px,4vw,54px);bottom:calc(20px + env(safe-area-inset-bottom));font-size:.68rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
@media(max-width:720px){.choices{grid-template-columns:1fr}.choice{min-height:auto;padding:18px}.choice-icon{margin-bottom:12px}.home-card{padding:10px 0}.brand span{display:none}.lyrics-shell{padding-left:22px;padding-right:22px}.lyric{font-size:clamp(1.85rem,9.5vw,3.35rem);margin-bottom:28px}.page{padding-top:88px}}
</style>
</head>
<body>
<audio id="audio" preload="metadata" src="INTRO COCINA ETC LXXXIX.mp3"></audio>

<header class="topbar hidden" id="topbar">
  <div class="brand"><strong>COCINA ETC LXXXIX</strong><span>CANCION DE COCINA</span></div>
  <div class="actions">
    <button class="icon-btn" id="homeBtn" aria-label="Inicio" title="Inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
    <button class="icon-btn" id="themeBtn" aria-label="Cambiar tema" title="Modo claro / oscuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2"/></svg></button>
  </div>
</header>

<section class="home" id="home">
  <div class="home-card">
    <img class="home-logo" src="logo.png" alt="Logo ETC LXXXIX">
    <h1>Cocina<br>ETC LXXXIX</h1>
    <div class="home-sub">CANCION DE COCINA</div>
    <div class="choices">
      <button class="choice" data-page="visualizer"><div class="choice-icon">♫</div><strong>VISUALIZADOR</strong><small>Sigue la letra sincronizada con la canción.</small></button>
      <button class="choice" data-page="listen"><div class="choice-icon">▶</div><strong>ESCUCHAR CANCIÓN</strong><small>Reproductor limpio para escuchar la mezcla completa.</small></button>
      <button class="choice" data-page="dance"><div class="choice-icon">♪</div><strong>APRENDER EL BAILE</strong><small>Video de los pasos y accesos rápidos por secciones.</small></button>
    </div>
  </div>
</section>

<section id="visualizer" class="view hidden">
  <main class="lyrics-shell"><div class="lyrics" id="lyrics"></div></main>
  <div class="status" id="status">Preparado</div>
</section>

<section id="listen" class="view page hidden">
  <div class="page-inner">
    <div class="section-title"><h2>Escuchar canción</h2><p>COCINA ETC LXXXIX</p></div>
    <div class="player-card">
      <img class="player-logo" src="logo.png" alt="">
      <div class="track-title">Canción de Cocina</div><div class="track-sub">ETC LXXXIX</div>
      <div class="time-row"><span id="curTime">0:00</span><span id="duration">4:40</span></div>
      <input class="range" id="seek" type="range" min="0" max="1000" value="0" aria-label="Progreso">
      <div class="transport">
        <button id="back10">−10 s</button><button class="main-play" id="listenPlay">▶</button><button id="forward10">+10 s</button>
      </div>
      <input class="range" id="volume" type="range" min="0" max="1" step=".01" value="1" aria-label="Volumen">
    </div>
  </div>
</section>

<section id="dance" class="view page hidden">
  <div class="page-inner video-card">
    <div class="section-title"><h2>Aprender el baile</h2><p>VIDEO DE LOS PASOS</p></div>
    <div class="video-wrap">
      <video id="danceVideo" controls playsinline preload="none"></video>
      <div class="video-state" id="videoState">Toca reproducir para cargar el video</div>
    </div>
    <div class="buffer-box">
      <div class="buffer-label"><span>Video disponible</span><span id="bufferPct">0%</span></div>
      <div class="buffer-track"><div class="buffer-fill" id="bufferFill"></div></div>
    </div>
    <div class="chapters">
      <button data-time="0">Inicio</button>
      <button data-time="2.7">El avión</button>
      <button data-time="131.1">Abre que voy</button>
      <button data-time="179.55">Tun Tun</button>
      <button data-time="253.44">Final</button>
    </div>
  </div>
</section>

<script>
const audio=document.getElementById('audio'),video=document.getElementById('danceVideo');
const home=document.getElementById('home'),topbar=document.getElementById('topbar');
const views=[...document.querySelectorAll('.view')],lyricsEl=document.getElementById('lyrics'),statusEl=document.getElementById('status');
let lyrics=[],activeIndex=-1,autoScroll=true,resumeTimer=null,currentPage='home',videoInitialized=false,wakeLock=null;

function showPage(id){
  currentPage=id; home.classList.toggle('hidden',id!=='home'); topbar.classList.toggle('hidden',id==='home');
  views.forEach(v=>v.classList.toggle('hidden',v.id!==id));
  if(id==='home'){audio.pause();video.pause();releaseWakeLock()}
  if(id==='visualizer'){video.pause(); if(audio.paused) audio.play().catch(()=>{}); sync(true)}
  if(id==='listen'){video.pause(); updatePlayer()}
  if(id==='dance'){audio.pause(); initVideo(); updatePlayer()}
}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
document.getElementById('homeBtn').onclick=()=>showPage('home');

function initVideo(){
  if(videoInitialized)return;
  video.src='baile.mp4'; videoInitialized=true; video.load();
}
function parseLRC(t){const a=[],r=/^\[(\d{2}):(\d{2}(?:\.\d+)?)\](.*)$/;t.split(/\r?\n/).forEach(l=>{const m=l.match(r);if(m&&m[3].trim())a.push({time:+m[1]*60 + +m[2],text:m[3].trim()})});return a.sort((a,b)=>a.time-b.time)}
fetch('lyrics.lrc').then(r=>r.text()).then(t=>{lyrics=parseLRC(t);renderLyrics()}).catch(()=>statusEl.textContent='Error al cargar letras');
function renderLyrics(){lyricsEl.innerHTML='<div class="spacer"></div>';lyrics.forEach((x,i)=>{const e=document.createElement('div');e.className='lyric';e.textContent=x.text;e.dataset.index=i;e.onclick=()=>{audio.currentTime=x.time;audio.play().catch(()=>{});autoScroll=true;sync(true)};lyricsEl.appendChild(e)});lyricsEl.insertAdjacentHTML('beforeend','<div class="spacer"></div>')}
function lyricIndex(t){let l=0,h=lyrics.length-1,a=-1;while(l<=h){const m=(l+h)>>1;if(lyrics[m].time<=t){a=m;l=m+1}else h=m-1}return a}
function sync(force=false){const i=lyricIndex(audio.currentTime);if(i===activeIndex&&!force)return;lyricsEl.querySelector('.active')?.classList.remove('active');activeIndex=i;if(i>=0){const e=lyricsEl.querySelector(`[data-index="${i}"]`);e?.classList.add('active');if(e&&autoScroll)e.scrollIntoView({behavior:'smooth',block:'center'})}}
lyricsEl.addEventListener('touchmove',userScrolled,{passive:true});lyricsEl.addEventListener('wheel',userScrolled,{passive:true});
function userScrolled(){autoScroll=false;clearTimeout(resumeTimer);resumeTimer=setTimeout(()=>{autoScroll=true;sync(true)},3500)}

function fmt(s){if(!Number.isFinite(s))return'0:00';return Math.floor(s/60)+':'+Math.floor(s%60).toString().padStart(2,'0')}
function updatePlayer(){document.getElementById('curTime').textContent=fmt(audio.currentTime);document.getElementById('duration').textContent=fmt(audio.duration||280);document.getElementById('seek').value=audio.duration?(audio.currentTime/audio.duration)*1000:0;document.getElementById('listenPlay').textContent=audio.paused?'▶':'Ⅱ'}
audio.addEventListener('timeupdate',()=>{sync();updatePlayer()});audio.addEventListener('play',()=>{video.pause();updatePlayer();requestWakeLock()});audio.addEventListener('pause',()=>{updatePlayer();if(video.paused)releaseWakeLock()});audio.addEventListener('ended',releaseWakeLock);
document.getElementById('listenPlay').onclick=()=>audio.paused?audio.play():audio.pause();
document.getElementById('back10').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-10);
document.getElementById('forward10').onclick=()=>audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+10);
document.getElementById('seek').oninput=e=>{if(audio.duration)audio.currentTime=(+e.target.value/1000)*audio.duration};
document.getElementById('volume').oninput=e=>audio.volume=+e.target.value;

function updateBuffer(){
  const fill=document.getElementById('bufferFill'),pct=document.getElementById('bufferPct');
  if(!video.duration||!video.buffered.length){fill.style.width='0%';pct.textContent='0%';return}
  let furthest=0;for(let i=0;i<video.buffered.length;i++)furthest=Math.max(furthest,video.buffered.end(i));
  const p=Math.min(100,furthest/video.duration*100);fill.style.width=p+'%';pct.textContent=Math.round(p)+'%';
}
video.addEventListener('progress',updateBuffer);video.addEventListener('loadedmetadata',()=>{updateBuffer();document.getElementById('videoState').classList.add('hidden')});
video.addEventListener('waiting',()=>{const s=document.getElementById('videoState');s.textContent='Cargando video…';s.classList.remove('hidden')});
video.addEventListener('playing',()=>{audio.pause();document.getElementById('videoState').classList.add('hidden');requestWakeLock()});
video.addEventListener('pause',()=>{if(audio.paused)releaseWakeLock()});video.addEventListener('ended',releaseWakeLock);
document.querySelectorAll('.chapters button').forEach(b=>b.onclick=()=>{initVideo();video.currentTime=+b.dataset.time;video.play().catch(()=>{})});

function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('etc89-theme',t);document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#0d0d0c':'#fbfaf6'}
applyTheme(localStorage.getItem('etc89-theme')||'light');
document.getElementById('themeBtn').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

async function requestWakeLock(){if(!('wakeLock'in navigator)||document.visibilityState!=='visible'||wakeLock)return;try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null)}catch(e){wakeLock=null}}
async function releaseWakeLock(){if(!wakeLock)return;try{await wakeLock.release()}catch(e){}wakeLock=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(!audio.paused||!video.paused))requestWakeLock();else wakeLock=null});
</script>
</body>
</html>
